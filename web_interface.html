<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Premiere AI Captioning Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
        }

        /* Compact Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 20px;
            margin-bottom: 3px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Settings - Collapsible */
        .settings-panel {
            background: #f8f9fa;
            padding: 15px;
            border-bottom: 2px solid #e0e0e0;
            flex-shrink: 0;
        }

        .settings-panel.collapsed {
            display: none;
        }

        .settings-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .setting-group {
            flex: 1;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
            font-size: 12px;
        }

        select {
            width: 100%;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
            background: white;
            cursor: pointer;
        }

        .model-info {
            font-size: 10px;
            color: #666;
            margin-top: 3px;
        }

        /* Drop Zone - Compact */
        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            background: #f8f9fa;
            margin: 15px;
            flex-shrink: 0;
        }

        .drop-zone.collapsed {
            display: none;
        }

        .drop-zone.loaded {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .drop-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .drop-text {
            font-size: 14px;
            color: #666;
        }

        .file-info {
            font-size: 12px;
            color: #999;
        }

        /* Progress */
        .progress-section {
            display: none;
            padding: 15px;
            flex-shrink: 0;
        }

        .progress-bar {
            height: 25px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
        }

        .progress-message {
            text-align: center;
            color: #666;
            font-size: 12px;
        }

        /* Buttons - Compact */
        .buttons {
            display: flex;
            gap: 8px;
            padding: 15px;
            flex-shrink: 0;
        }

        .buttons.collapsed {
            display: none;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .hidden {
            display: none;
        }

        input[type="file"] {
            display: none;
        }

        /* Video Player & Editor - 100vh Layout */
        .video-editor-container {
            display: none;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .video-editor-layout {
            display: flex;
            height: 100%;
            gap: 15px;
            padding: 15px;
        }

        /* Video Section - Left Side */
        .video-section {
            flex: 0 0 45%;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .video-player {
            flex: 1;
            border-radius: 10px;
            background: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .video-player video {
            flex: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-controls {
            background: #333;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .play-pause-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .play-pause-btn:hover {
            background: #5568d3;
        }

        .time-display {
            color: white;
            font-size: 11px;
            font-family: monospace;
            white-space: nowrap;
        }

        .video-progress {
            flex: 1;
            height: 5px;
            background: #555;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .video-progress-fill {
            height: 100%;
            background: #667eea;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Editor Section - Right Side */
        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }

        .editor-header {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .editor-title {
            font-size: 14px;
            font-weight: 600;
        }

        .caption-count {
            color: #666;
            font-size: 11px;
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 5px;
        }

        /* Captions Container - Scrollable */
        .captions-container {
            flex: 1;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
        }

        .captions-container::-webkit-scrollbar {
            width: 8px;
        }

        .captions-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .captions-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .captions-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Caption Item - Compact */
        .caption-item {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid #ccc;
            transition: all 0.2s;
            cursor: pointer;
        }

        .caption-item:nth-child(even) {
            background: #fff;
        }

        .caption-item:hover {
            border-left-color: #667eea;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .caption-item.active {
            border-left-color: #667eea;
            background: #e8f0ff !important;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
        }

        .caption-header {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .caption-index {
            font-weight: 600;
            color: #667eea;
            min-width: 30px;
            font-size: 11px;
        }

        .caption-item.active .caption-index {
            color: #4556c7;
            font-size: 13px;
        }

        .timestamp-input {
            padding: 4px 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 10px;
            width: 100px;
        }

        .timestamp-separator {
            color: #999;
            font-size: 10px;
        }

        .caption-text {
            width: 100%;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            min-height: 40px;
            resize: vertical;
            font-family: inherit;
            line-height: 1.4;
        }

        .caption-item.active .caption-text {
            border-color: #667eea;
            background: white;
        }

        /* Word-by-word highlighting */
        .caption-text-display {
            padding: 6px;
            font-size: 12px;
            line-height: 1.6;
            min-height: 40px;
            word-wrap: break-word;
        }

        .caption-word {
            display: inline;
            transition: all 0.15s;
            padding: 2px 1px;
            border-radius: 3px;
        }

        .caption-word.active-word {
            background: #ffd54f;
            color: #000;
            font-weight: 600;
            padding: 2px 4px;
        }

        .caption-actions {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .btn-edit {
            background: #667eea;
            color: white;
        }

        /* Status Bar - Compact */
        .status-bar {
            background: #333;
            color: white;
            padding: 8px;
            text-align: center;
            font-size: 11px;
            flex-shrink: 0;
        }

        /* Action Buttons in Header */
        .action-buttons {
            display: flex;
            gap: 8px;
            padding: 10px 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        .action-buttons.collapsed {
            display: none;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .video-editor-layout {
                flex-direction: column;
            }

            .video-section {
                flex: 0 0 40%;
            }

            .editor-section {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Compact Header -->
        <div class="header">
            <h1>🎬 Adobe Premiere AI Captioning</h1>
            <p>Generate and edit captions with real-time video sync</p>
        </div>

        <div class="main-content">
            <!-- Settings Panel -->
            <div class="settings-panel" id="settingsPanel">
                <div class="settings-row">
                    <div class="setting-group">
                        <label for="language">Language</label>
                        <select id="language">
                            <option value="auto">Auto-detect</option>
                            <option value="en">English</option>
                            <option value="hi">Hindi (हिंदी)</option>
                            <option value="mr">Marathi (मराठी)</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="model">Model Accuracy</label>
                        <select id="model">
                            <option value="tiny">Tiny - ⚡⚡⚡⚡ Fastest</option>
                            <option value="base" selected>Base - ⚡⚡⚡ Balanced</option>
                            <option value="small">Small - ⚡⚡ Better</option>
                            <option value="medium">Medium - ⚡ Best</option>
                        </select>
                        <div class="model-info">💡 Larger = slower + accurate</div>
                    </div>
                </div>
            </div>

            <!-- Drop Zone -->
            <div class="drop-zone" id="dropZone">
                <div class="drop-icon">🎥</div>
                <div class="drop-text">Drag & Drop Video or Click</div>
                <div class="file-info">MP4, MOV, AVI, MKV</div>
            </div>
            <input type="file" id="fileInput" accept="video/*">

            <!-- Progress Section -->
            <div class="progress-section" id="progressSection">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
                <div class="progress-message" id="progressMessage">Ready</div>
            </div>

            <!-- Buttons -->
            <div class="buttons" id="buttonsPanel">
                <button class="btn-secondary" id="browseBtn">📁 Browse</button>
                <button class="btn-primary" id="generateBtn" disabled>▶️ Generate Captions</button>
            </div>

            <!-- Action Buttons (shown after generation) -->
            <div class="action-buttons collapsed" id="actionButtons">
                <button class="btn-success btn-small" id="saveBtn">💾 Save</button>
                <button class="btn-success btn-small" id="downloadBtn">⬇️ Download SRT</button>
            </div>

            <!-- Video Player & Editor - 100vh -->
            <div class="video-editor-container" id="videoEditorContainer">
                <div class="video-editor-layout">
                    <!-- Video Section -->
                    <div class="video-section">
                        <div class="video-player">
                            <video id="videoPlayer"></video>
                            <div class="video-controls">
                                <button class="play-pause-btn" id="playPauseBtn">▶️ Play</button>
                                <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
                                <div class="video-progress" id="videoProgress">
                                    <div class="video-progress-fill" id="videoProgressFill"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Editor Section -->
                    <div class="editor-section">
                        <div class="editor-header">
                            <div>
                                <div class="editor-title">✏️ Captions (Click to jump)</div>
                                <div class="caption-count" id="captionCount">0 captions</div>
                            </div>
                        </div>
                        <div class="captions-container" id="captionsContainer">
                            <!-- Captions will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-bar" id="statusBar">
            Ready - Drop a video file or click Browse
        </div>
    </div>

    <script>
        let currentJobId = null;
        let currentFile = null;
        let currentVideoUrl = null;
        let captions = [];
        let currentActiveCaptionIndex = -1;
        let editingCaptionIndex = -1;

        // DOM Elements
        const settingsPanel = document.getElementById('settingsPanel');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const browseBtn = document.getElementById('browseBtn');
        const generateBtn = document.getElementById('generateBtn');
        const saveBtn = document.getElementById('saveBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const buttonsPanel = document.getElementById('buttonsPanel');
        const actionButtons = document.getElementById('actionButtons');
        const progressSection = document.getElementById('progressSection');
        const progressFill = document.getElementById('progressFill');
        const progressMessage = document.getElementById('progressMessage');
        const videoEditorContainer = document.getElementById('videoEditorContainer');
        const captionsContainer = document.getElementById('captionsContainer');
        const captionCount = document.getElementById('captionCount');
        const statusBar = document.getElementById('statusBar');

        // Video Player Elements
        const videoPlayer = document.getElementById('videoPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const videoProgress = document.getElementById('videoProgress');
        const videoProgressFill = document.getElementById('videoProgressFill');

        // Drag and drop handlers
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#667eea';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#ccc';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ccc';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        browseBtn.addEventListener('click', () => fileInput.click());

        function handleFile(file) {
            currentFile = file;
            dropZone.classList.add('loaded');
            dropZone.innerHTML = `
                <div class="drop-icon">✅</div>
                <div class="drop-text">Video Loaded</div>
                <div class="file-info">${file.name} (${formatFileSize(file.size)})</div>
            `;
            generateBtn.disabled = false;
            statusBar.textContent = `Loaded: ${file.name}`;

            // Create object URL for video preview
            currentVideoUrl = URL.createObjectURL(file);
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
        }

        generateBtn.addEventListener('click', async () => {
            if (!currentFile) return;

            const formData = new FormData();
            formData.append('video', currentFile);
            formData.append('language', document.getElementById('language').value);
            formData.append('model', document.getElementById('model').value);

            generateBtn.disabled = true;
            browseBtn.disabled = true;
            progressSection.style.display = 'block';
            videoEditorContainer.style.display = 'none';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                currentJobId = data.job_id;
                statusBar.textContent = 'Processing started...';

                // Poll for status
                pollStatus();
            } catch (error) {
                statusBar.textContent = 'Error: ' + error.message;
                generateBtn.disabled = false;
                browseBtn.disabled = false;
            }
        });

        function pollStatus() {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/status/${currentJobId}`);
                    const data = await response.json();

                    updateProgress(data.progress, data.message);

                    if (data.status === 'complete') {
                        clearInterval(interval);
                        onProcessingComplete();
                    } else if (data.status === 'error') {
                        clearInterval(interval);
                        onProcessingError(data.message);
                    }
                } catch (error) {
                    clearInterval(interval);
                    onProcessingError(error.message);
                }
            }, 1000);
        }

        function updateProgress(progress, message) {
            progressFill.style.width = progress + '%';
            progressFill.textContent = Math.round(progress) + '%';
            progressMessage.textContent = message;
            statusBar.textContent = message;
        }

        async function onProcessingComplete() {
            statusBar.textContent = '✅ Captions generated! Loading player...';

            // Load captions and show video player
            await loadCaptions();
            showVideoPlayer();

            // Collapse upload UI
            settingsPanel.classList.add('collapsed');
            dropZone.classList.add('collapsed');
            buttonsPanel.classList.add('collapsed');
            progressSection.style.display = 'none';
            actionButtons.classList.remove('collapsed');
        }

        function onProcessingError(message) {
            statusBar.textContent = '❌ Error: ' + message;
            generateBtn.disabled = false;
            browseBtn.disabled = false;
            progressSection.style.display = 'none';
        }

        async function loadCaptions() {
            try {
                const response = await fetch(`/captions/${currentJobId}`);
                const data = await response.json();
                captions = data.captions;

                renderCaptions();
                captionCount.textContent = `${captions.length} captions - ${data.detected_language}`;
            } catch (error) {
                statusBar.textContent = 'Error loading captions: ' + error.message;
            }
        }

        function showVideoPlayer() {
            if (!currentVideoUrl) return;

            videoEditorContainer.style.display = 'block';
            videoPlayer.src = currentVideoUrl;
            videoPlayer.load();

            statusBar.textContent = '🎥 Ready! Press Play to see word-by-word highlighting';
        }

        function renderCaptions() {
            captionsContainer.innerHTML = '';

            captions.forEach((caption, index) => {
                const item = document.createElement('div');
                item.className = 'caption-item';
                item.dataset.index = index;
                item.dataset.start = timeToSeconds(caption.start);
                item.dataset.end = timeToSeconds(caption.end);

                // Split text into words for word-by-word highlighting
                const words = caption.text.split(/\s+/);
                const duration = timeToSeconds(caption.end) - timeToSeconds(caption.start);
                const timePerWord = duration / words.length;

                // Create word spans with estimated timings
                let wordHTML = '';
                words.forEach((word, wordIndex) => {
                    const wordStart = timeToSeconds(caption.start) + (wordIndex * timePerWord);
                    const wordEnd = wordStart + timePerWord;
                    wordHTML += `<span class="caption-word" data-word-start="${wordStart}" data-word-end="${wordEnd}">${word}</span> `;
                });

                item.innerHTML = `
                    <div class="caption-header">
                        <span class="caption-index">#${caption.index}</span>
                        <input type="text" class="timestamp-input" value="${caption.start}"
                               data-index="${index}" data-field="start">
                        <span class="timestamp-separator">→</span>
                        <input type="text" class="timestamp-input" value="${caption.end}"
                               data-index="${index}" data-field="end">
                    </div>
                    <div class="caption-text-display" data-index="${index}">
                        ${wordHTML}
                    </div>
                    <div class="caption-actions">
                        <button class="btn-small btn-edit" onclick="editCaption(${index})">✏️ Edit</button>
                        <button class="btn-small btn-delete" onclick="deleteCaption(${index})">🗑️</button>
                    </div>
                `;
                captionsContainer.appendChild(item);

                // Click caption to seek video
                item.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('timestamp-input') &&
                        !e.target.classList.contains('btn-delete') &&
                        !e.target.classList.contains('btn-edit')) {
                        seekToCaption(index);
                    }
                });
            });

            // Add event listeners
            document.querySelectorAll('.timestamp-input').forEach(input => {
                input.addEventListener('change', handleTimestampChange);
            });
        }

        function timeToSeconds(timeStr) {
            const parts = timeStr.split(':');
            const hours = parseInt(parts[0]);
            const minutes = parseInt(parts[1]);
            const secParts = parts[2].split(',');
            const seconds = parseInt(secParts[0]);
            const milliseconds = parseInt(secParts[1] || 0);

            return hours * 3600 + minutes * 60 + seconds + milliseconds / 1000;
        }

        function seekToCaption(index) {
            const caption = captions[index];
            const startTime = timeToSeconds(caption.start);
            videoPlayer.currentTime = startTime;
            if (videoPlayer.paused) {
                videoPlayer.play();
            }
        }

        function editCaption(index) {
            const item = document.querySelector(`.caption-item[data-index="${index}"]`);
            const displayDiv = item.querySelector('.caption-text-display');
            const currentText = captions[index].text;

            // Replace display with textarea
            displayDiv.outerHTML = `<textarea class="caption-text" data-index="${index}">${currentText}</textarea>`;

            // Update button
            const editBtn = item.querySelector('.btn-edit');
            editBtn.textContent = '💾 Save';
            editBtn.onclick = () => saveCaption(index);

            editingCaptionIndex = index;
        }

        function saveCaption(index) {
            const item = document.querySelector(`.caption-item[data-index="${index}"]`);
            const textarea = item.querySelector('.caption-text');
            captions[index].text = textarea.value;

            // Re-render this caption
            renderCaptions();
            statusBar.textContent = 'Caption edited - Click Save to persist';
            editingCaptionIndex = -1;
        }

        // Video Player Controls
        playPauseBtn.addEventListener('click', () => {
            if (videoPlayer.paused) {
                videoPlayer.play();
                playPauseBtn.textContent = '⏸️ Pause';
            } else {
                videoPlayer.pause();
                playPauseBtn.textContent = '▶️ Play';
            }
        });

        videoPlayer.addEventListener('timeupdate', () => {
            const currentTime = videoPlayer.currentTime;
            const duration = videoPlayer.duration || 0;

            // Update progress bar
            const progress = (currentTime / duration) * 100;
            videoProgressFill.style.width = progress + '%';

            // Update time display
            timeDisplay.textContent = `${formatTime(currentTime)} / ${formatTime(duration)}`;

            // Highlight active caption and word
            highlightActiveCaption(currentTime);
            highlightActiveWord(currentTime);
        });

        videoPlayer.addEventListener('play', () => {
            playPauseBtn.textContent = '⏸️ Pause';
        });

        videoPlayer.addEventListener('pause', () => {
            playPauseBtn.textContent = '▶️ Play';
        });

        // Click progress bar to seek
        videoProgress.addEventListener('click', (e) => {
            const rect = videoProgress.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percentage = x / rect.width;
            videoPlayer.currentTime = percentage * videoPlayer.duration;
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function highlightActiveCaption(currentTime) {
            let activeIndex = -1;

            captions.forEach((caption, index) => {
                const start = timeToSeconds(caption.start);
                const end = timeToSeconds(caption.end);

                if (currentTime >= start && currentTime < end) {
                    activeIndex = index;
                }
            });

            if (activeIndex !== currentActiveCaptionIndex) {
                document.querySelectorAll('.caption-item').forEach(item => {
                    item.classList.remove('active');
                });

                if (activeIndex >= 0) {
                    const activeItem = document.querySelector(`.caption-item[data-index="${activeIndex}"]`);
                    if (activeItem) {
                        activeItem.classList.add('active');
                        activeItem.scrollIntoView({
                            behavior: 'smooth',
                            block: 'center'
                        });
                    }
                }

                currentActiveCaptionIndex = activeIndex;
            }
        }

        function highlightActiveWord(currentTime) {
            // Remove all word highlights
            document.querySelectorAll('.caption-word').forEach(word => {
                word.classList.remove('active-word');
            });

            // Find and highlight current word
            document.querySelectorAll('.caption-word').forEach(word => {
                const wordStart = parseFloat(word.dataset.wordStart);
                const wordEnd = parseFloat(word.dataset.wordEnd);

                if (currentTime >= wordStart && currentTime < wordEnd) {
                    word.classList.add('active-word');
                }
            });
        }

        function handleTimestampChange(e) {
            const index = parseInt(e.target.dataset.index);
            const field = e.target.dataset.field;
            captions[index][field] = e.target.value;

            const item = document.querySelector(`.caption-item[data-index="${index}"]`);
            if (field === 'start') {
                item.dataset.start = timeToSeconds(e.target.value);
            } else {
                item.dataset.end = timeToSeconds(e.target.value);
            }

            // Re-render to update word timings
            renderCaptions();
            statusBar.textContent = 'Modified - Click Save';
        }

        function deleteCaption(index) {
            if (confirm(`Delete caption #${captions[index].index}?`)) {
                captions.splice(index, 1);
                renderCaptions();
                captionCount.textContent = `${captions.length} captions`;
                statusBar.textContent = 'Caption deleted - Click Save';
            }
        }

        saveBtn.addEventListener('click', async () => {
            try {
                const response = await fetch(`/save/${currentJobId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ captions })
                });

                const data = await response.json();
                statusBar.textContent = '✅ ' + data.message;
            } catch (error) {
                statusBar.textContent = '❌ Save failed: ' + error.message;
            }
        });

        downloadBtn.addEventListener('click', () => {
            window.location.href = `/download/${currentJobId}`;
            statusBar.textContent = 'Downloading...';
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                playPauseBtn.click();
            }
        });
    </script>
</body>
</html>
